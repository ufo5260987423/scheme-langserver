# Project-level configuration for the scheme-langserver MCP bridge.
# Single-thread mode: measured fastest at init on this repo (~50 ms cold vs
# ~0.55-0.95 s multi-thread, 2026-10-29). The persisted workspace cache is
# kept for instant diagnostics after restart, not for init speed -- a warm
# cache load (~300 ms) currently costs more than a cold init.

langserver_path = "/home/ufo/Documents/workspace/scheme-langserver/run-mcp-cache.sh"
multi_thread = "disable"
type_inference = "disable"
top_environment = "R6RS"
cache_path = "/home/ufo/Documents/workspace/scheme-langserver/.scheme-langserver-cache"

# Loading the full scheme-langserver workspace (128 .sls files, ~39MB FASL)
# into memory requires more than the default 1024MB virtual address limit.
# Saving the cache also needs substantial virtual address space, so keep a
# generous margin.
max_memory_mb = 8192
