name: Test Windows Build

on:
  workflow_dispatch:

jobs:
  generate-c:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev uuid-dev zlib1g-dev liblz4-dev curl wget

      - name: Install Chez Scheme 10.4.1
        run: |
          curl -L https://github.com/cisco/ChezScheme/releases/download/v10.4.1/csv10.4.1.tar.gz | tar -zx
          cd csv10.4.1
          ./configure --threads --disable-x11
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf csv10.4.1

      - name: Install ufo5260987423/chez-exe (Linux fork with libkernel.a support)
        run: |
          git clone https://github.com/ufo5260987423/chez-exe.git
          cd chez-exe
          /usr/bin/scheme --script gen-config.ss --bootpath /usr/lib/csv10.4.1/ta6le --kernel libkernel.a
          sudo make install

      - name: Install Akku
        run: |
          wget -q https://gitlab.com/-/project/6808260/uploads/094ce726ce3c6cf8c14560f1e31aaea0/akku-1.1.0.amd64-linux.tar.xz
          tar -xf akku-1.1.0.amd64-linux.tar.xz
          cd akku-1.1.0.amd64-linux && bash install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: akku install

      - name: Generate run.generated.c
        run: |
          source .akku/bin/activate
          rm -f run.generated.c run.chez run.so run.wpo
          compile-chez-program run.ss

      - name: Generate .version
        run: git describe --tags --always --dirty > .version 2>/dev/null || echo "2.1.0" > .version

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-files
          include-hidden-files: true
          path: |
            run.generated.c
            .version

  build-windows:
    runs-on: windows-latest
    needs: generate-c
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build-files

      - name: Download Chez Scheme installer
        run: |
          curl -L -o ChezScheme.exe https://github.com/cisco/ChezScheme/releases/download/v10.4.1/ChezScheme10.4.1.exe
          echo "Installer downloaded"

      - name: Install Chez Scheme
        run: |
          ./ChezScheme.exe /S
          Start-Sleep -Seconds 30

      - name: Copy to short path
        run: |
          $src = "C:\Program Files\Chez Scheme 10.4.1"
          $dst = "C:\ChezScheme"
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Copy-Item -Path $src -Destination $dst -Recurse
          echo "Copied to $dst"

      - name: Verify Chez Scheme files
        run: |
          echo "=== C:\ChezScheme contents ==="
          Get-ChildItem "C:\ChezScheme" -Depth 1
          echo "=== boot dir ==="
          Get-ChildItem "C:\ChezScheme\boot" -Depth 1
          echo "=== boot\ta6nt dir ==="
          Get-ChildItem "C:\ChezScheme\boot\ta6nt"
          echo "=== bin\ta6nt dir ==="
          Get-ChildItem "C:\ChezScheme\bin\ta6nt"
          echo "=== Searching for scheme.h ==="
          $h = Get-ChildItem -Path "C:\ChezScheme" -Recurse -Filter "scheme.h" | Select-Object -First 1
          if ($h) { echo "scheme.h FOUND at: $($h.FullName)" } else { echo "scheme.h MISSING"; exit 1 }
          echo "=== Searching for petite.boot ==="
          $pb = Get-ChildItem -Path "C:\ChezScheme" -Recurse -Filter "petite.boot" | Select-Object -First 1
          if ($pb) { echo "petite.boot FOUND at: $($pb.FullName)" } else { echo "petite.boot MISSING"; exit 1 }
          echo "=== Searching for csv*.lib ==="
          Get-ChildItem "C:\ChezScheme" -Recurse -Filter "csv*.lib" | ForEach-Object { echo "FOUND: $($_.FullName)" }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone gwatt/chez-exe
        run: git clone https://github.com/gwatt/chez-exe.git

      - name: Generate tools.ini and patch Makefile.win for /MT
        run: |
          cd chez-exe
          echo '[NMAKE]' > tools.ini
          echo 'scheme = C:\ChezScheme\bin\ta6nt\scheme.exe' >> tools.ini
          echo 'bootpath = C:\ChezScheme\boot\ta6nt' >> tools.ini
          echo 'installbindir = C:\ChezScheme\bin' >> tools.ini
          echo 'installlibdir = C:\ChezScheme\lib' >> tools.ini
          echo "Generated tools.ini:"
          Get-Content "tools.ini"
          echo "Patching Makefile.win for /MT static CRT..."
          (Get-Content "Makefile.win") `
            -replace '/MD ', '/MT ' `
            -replace 'csv\*md\.lib', 'csv*mt.lib' |
            Set-Content "Makefile.win"
          echo "Patched Makefile.win:"
          Get-Content "Makefile.win"

      - name: Build chez-exe with nmake
        run: |
          cd chez-exe
          nmake /f Makefile.win clean
          nmake /f Makefile.win

      - name: Inspect build outputs
        run: |
          cd chez-exe
          echo "=== All files ==="
          Get-ChildItem
          echo "=== Check console_main.obj ==="
          if (Test-Path "console_main.obj") { echo "FOUND console_main.obj" } else { echo "NOT FOUND" }
          echo "=== Check petite-chez.lib ==="
          if (Test-Path "petite-chez.lib") { echo "FOUND petite-chez.lib" } else { echo "NOT FOUND" }

      - name: Install zlib and LZ4 via vcpkg
        run: |
          cd C:\vcpkg
          .\vcpkg install zlib:x64-windows-static
          .\vcpkg install lz4:x64-windows-static
          echo "=== All installed .lib files ==="
          Get-ChildItem "C:\vcpkg\installed\x64-windows-static\lib" -Filter "*.lib"

      - name: Link run.exe
        run: |
          copy run.generated.c chez-exe\
          cd chez-exe
          $vcpkgLib = "C:\vcpkg\installed\x64-windows-static\lib"
          $zlib = Get-ChildItem $vcpkgLib -Filter "zlib*.lib" | Select-Object -First 1
          if (-not $zlib) { $zlib = Get-ChildItem $vcpkgLib -Filter "libz*.lib" | Select-Object -First 1 }
          if (-not $zlib) { $zlib = Get-ChildItem $vcpkgLib -Filter "zs.lib" | Select-Object -First 1 }
          $lz4 = Get-ChildItem $vcpkgLib -Filter "lz4*.lib" | Select-Object -First 1
          echo "zlib found: $($zlib.FullName)"
          echo "lz4 found: $($lz4.FullName)"
          $libs = @("rpcrt4.lib", "ole32.lib", "advapi32.lib", "User32.lib", "petite-chez.lib", "legacy_stdio_definitions.lib")
          if ($zlib) { $libs += $zlib.FullName }
          if ($lz4) { $libs += $lz4.FullName }
          echo "Linking with: $libs"
          cl /nologo /MT /Fe:run.exe run.generated.c console_main.obj @libs

      - name: Verify run.exe
        run: |
          cd chez-exe
          if (Test-Path "run.exe") {
            echo "SUCCESS: run.exe exists"
            ls run.exe
          } else {
            echo "FAILED: run.exe not found"
            exit 1
          }

      - name: Copy .version
        run: |
          if (Test-Path ".version") { copy .version chez-exe\ } else { echo "2.1.0" | Out-File chez-exe\.version -Encoding ASCII }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheme-langserver-windows-test
          path: |
            chez-exe\run.exe
            chez-exe\.version
